<title>就活日和</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 上部ヘッダー＋「いま意識すること」帯（全画面）／ホーム最上段にレベルと意識カード／スマホは下部ナビ */
:root{
  --bg:#f2f6fb; --surface:#ffffff; --line:#dbe3ee; --fg:#1a2433; --muted:#627089;
  --accent:#2f6fc9; --accent-soft:#e4eefb; --accent-ink:#ffffff; --sky:#3a7bd5; --sun:#ffd66b;
  --gold:#c98a12; --gold-soft:#fcf1d8;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --warn:#b86e00; --warn-soft:#fbf0dc; --bad:#c23b3b; --bad-soft:#f9e3e3;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151d; --surface:#19212c; --line:#2a3443; --fg:#e7ecf3; --muted:#98a4b6;
  --accent:#7fb0f5; --accent-soft:#1d2d44; --accent-ink:#0c1522;
  --gold:#f0b94a; --gold-soft:#3a2e12;
  --ok:#4cc38a; --ok-soft:#173327; --warn:#e8a33d; --warn-soft:#3a2c14; --bad:#f07171; --bad-soft:#3d1d1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151d; --surface:#19212c; --line:#2a3443; --fg:#e7ecf3; --muted:#98a4b6;
  --accent:#7fb0f5; --accent-soft:#1d2d44; --accent-ink:#0c1522;
  --gold:#f0b94a; --gold-soft:#3a2e12;
  --ok:#4cc38a; --ok-soft:#173327; --warn:#e8a33d; --warn-soft:#3a2c14; --bad:#f07171; --bad-soft:#3d1d1f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* 左サイドメニュー（PC） */
.side{position:fixed;top:0;bottom:0;left:0;width:232px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));z-index:15;overflow-y:auto}
.side .logo{padding:0 8px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left;width:100%}
.snav button svg{width:20px;height:20px;flex:none}
.snav button:hover{background:var(--bg);color:var(--fg)}
.snav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.snav .cnt{margin-left:auto;font-size:11px;font-family:var(--font-mono);background:var(--gold);color:var(--surface);border-radius:999px;padding:0 7px;font-weight:600}
.sact{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:16px}
.sact .label{padding:0 4px 2px}
.sact .btn{width:100%;text-align:left}
.slv{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.slv .r{display:flex;align-items:center;gap:8px}
.slv .lv{background:var(--gold);color:var(--surface);border-radius:999px;padding:1px 8px;font-family:var(--font-mono);font-weight:600;font-size:12px}
.slv .t{font-weight:700;font-size:13px}
.slv .xp{height:6px}
.slv .s{font-size:11px;color:var(--muted)}
.slv:hover{border-color:var(--gold)}
.shell{margin-left:232px;min-width:0}
.mtop{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--surface);border-bottom:1px solid var(--line);height:52px;padding-inline:16px;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:17px;letter-spacing:.04em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo svg{width:28px;height:28px;flex:none}
.lvchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;background:var(--surface);cursor:pointer;white-space:nowrap}
.lvchip .lv{background:var(--gold);color:var(--surface);border-radius:999px;padding:1px 8px;font-family:var(--font-mono);font-weight:600;font-size:12px}
.lvchip .mini{width:54px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.lvchip .mini i{display:block;height:100%;background:var(--gold)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:hover{filter:brightness(.97)}

/* 常時表示の意識帯 */
.focusbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;border-bottom:1px solid var(--line);background:var(--accent-soft)}
.focusbar button{max-width:1200px;margin:0 auto;padding:7px 16px;display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;cursor:pointer;text-align:left;color:var(--accent)}
.focusbar .k{font-size:11px;letter-spacing:.08em;font-weight:700;white-space:nowrap}
.focusbar .v{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.focusbar .n{font-size:12px;white-space:nowrap;opacity:.8}

main{max-width:1200px;margin:0 auto;padding:24px 16px 96px}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px}
h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:500}

/* Hero: 意識カード + レベル */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-bottom:20px}
.mind{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:22px 24px;min-width:0}
.mind-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mind-h .ttl{font-weight:900;font-size:13px;letter-spacing:.12em;color:var(--accent)}
.lessons{display:flex;flex-direction:column;gap:12px;counter-reset:ls}
.lesson{display:flex;gap:14px;align-items:flex-start}
.lesson .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600}
.lesson .tx{flex:1;min-width:0}
.lesson .tx b{display:block;font-size:19px;font-weight:700;line-height:1.45;text-wrap:pretty}
.lesson .tx span{font-size:12px;color:var(--muted)}
.lesson .btn{flex:none;margin-top:2px}
.mind .more{margin-top:12px;font-size:12px;color:var(--muted)}
.mind-empty{color:var(--muted);padding:6px 0}
.mind-empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}

.level{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.level .top{display:flex;align-items:center;gap:14px}
.badge{flex:none;width:64px;height:64px;border-radius:16px;background:var(--gold-soft);border:2px solid var(--gold);display:grid;place-items:center;line-height:1}
.badge small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--gold);font-weight:600;text-align:center}
.badge strong{display:block;font-family:var(--font-mono);font-size:26px;color:var(--gold);text-align:center}
.level .title{font-weight:900;font-size:18px}
.level .next{font-size:12px;color:var(--muted)}
.xp{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xp i{display:block;height:100%;background:var(--gold);transition:width .6s ease}
.xpnum{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.stats div{display:flex;flex-direction:column}
.stats .n{font-family:var(--font-mono);font-size:20px;font-weight:600}
.stats .l{font-size:11px;color:var(--muted)}

.nudge{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:12px 16px;margin-bottom:20px}
.nudge p{margin:0;flex:1;min-width:200px}
.nudge p b{color:var(--gold)}

/* デモ画面（未ログイン） */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;gap:12px;align-items:center;padding:8px 16px;background:var(--accent);color:var(--accent-ink)}
.demobar[hidden]{display:none}
.demobar p{margin:0;flex:1;min-width:0;font-size:13px}
.demobar .acts{display:flex;gap:8px;flex:none}
.demobar .btn{background:transparent;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 55%,transparent)}
.demobar .btn.primary{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
html.demo .focusbar{position:static}
#navAdmin[hidden]{display:none!important}
.demo-only{display:none!important}
html.demo .demo-only{display:flex!important}
html.demo button.demo-only{display:inline-flex!important;align-items:center}
.side-login{flex-direction:column;gap:8px;margin-top:auto}
html.demo .side .slv{display:none}
html.demo .chip.sample{display:none}
/* ホーム画面に追加の案内 */
.inst-rem{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 16px;margin-bottom:20px}
.inst-rem svg{width:36px;height:36px;flex:none}
.inst-rem p{margin:0;flex:1;min-width:180px}
.inst-rem p b{display:block;color:var(--accent)}
.inst-rem .x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px}
.onb{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:16px 18px;margin-bottom:20px}
.onb b{display:block;font-size:16px;color:var(--accent);margin-bottom:4px}
.onb p{margin:0}
.onb-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}

/* 未ログイン：ログイン画面と説明ページ */
#guest{display:none}
html.guest #guest{display:block}
html.guest .side,html.guest .shell,html.guest .bnav,html.guest .fab{display:none!important}
.g-wrap{max-width:1040px;margin:0 auto;padding:24px 20px 72px}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:20px}
.g-top .logo{font-size:18px}
.g-top .logo svg{width:34px;height:34px}
.g-top .acts{display:flex;gap:8px}
.login{max-width:420px;margin:32px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:22px;margin:0}
.login .field input{min-height:44px}
.login .btn{min-height:46px;font-size:15px}
.login .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.login .or::before,.login .or::after{content:"";flex:1;height:1px;background:var(--line)}
.about-cta{margin:20px auto 0;max-width:420px;display:flex;gap:14px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:16px 18px;cursor:pointer;border:0;width:100%;text-align:left;color:var(--fg)}
.about-cta svg{width:56px;height:56px;flex:none}
.about-cta b{display:block;font-size:15px;color:var(--accent)}
.about-cta span{font-size:13px;color:var(--muted)}
.about-cta .arrow{margin-left:auto;font-size:22px;color:var(--accent)}
.ab-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:24px 0 40px}
.ab-hero h1{font-size:38px;line-height:1.35;margin:0 0 16px;text-wrap:balance}
.ab-hero p{font-size:16px;color:var(--muted);margin:0 0 24px;line-height:1.8}
.ab-hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.ab-hero .btn,.ab-end .btn{min-height:48px;padding:0 22px;font-size:15px}
.ill{width:100%;height:auto;display:block}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;padding:40px 0;border-top:1px solid var(--line)}
.feat.rev .ill-box{order:2}
.feat .k{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:600}
.feat h2{font-size:24px;margin:6px 0 10px;display:block}
.feat p{margin:0;color:var(--muted);line-height:1.8;font-size:15px}
.ill-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.ab-steps{padding:40px 0;border-top:1px solid var(--line)}
.ab-steps h2{font-size:24px;display:block;margin:0 0 20px;text-align:center}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.steps3 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.steps3 .n{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600}
.steps3 b{font-size:16px}
.steps3 span{font-size:13px;color:var(--muted);line-height:1.7}
.ab-end{text-align:center;padding:40px 20px;border-radius:20px;background:var(--accent-soft);margin-top:24px}
.ab-end h2{display:block;font-size:22px;margin:0 0 8px}
.ab-end p{color:var(--muted);margin:0 0 20px}
html.mob .ab-hero,html.mob .feat{grid-template-columns:1fr;gap:20px}
html.mob .feat.rev .ill-box{order:0}
html.mob .ab-hero h1{font-size:28px}
html.mob .steps3{grid-template-columns:1fr}
html.mob .g-wrap{padding:16px 16px 56px}
html.mob .login{padding:24px 20px;margin-top:12px}
html.mob .g-top .acts .btn{padding:8px 12px}
html.mob .g-top .acts .btn:not(.primary):not(:only-child){display:none}

/* 管理画面 */
.ad-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.ad-tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.ad-tile b{font-size:24px;line-height:1.3}
.ad-tile small{font-size:12px;color:var(--muted)}
html.mob .ad-tiles{grid-template-columns:1fr 1fr}

/* わたしの軸 */
.lnk{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--fg);cursor:pointer;text-align:left}
.lnk:hover{color:var(--accent);text-decoration:underline}
.axpanel{margin-bottom:12px}
.axhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.axhead b{display:block;font-size:15px}
.axhead span{font-size:12px;color:var(--muted)}
.axchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.axfilter{align-items:center}
.axfilter select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px}
.rklist{display:flex;flex-direction:column;gap:8px}
.rk{display:grid;grid-template-columns:36px minmax(0,1fr) 150px auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.rk-n{font-size:18px;font-weight:600;color:var(--muted);text-align:center}
.rk:nth-child(-n+3) .rk-n{color:var(--accent)}
.rk-t{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.rk-ax{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:12px;color:var(--muted)}
.rk-ax .un{opacity:.6}
.rk-s{display:flex;flex-direction:column;gap:4px}
.rk-s b{font-size:20px;line-height:1}
.rk-s .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rk-s .bar i{display:block;height:100%;background:var(--accent)}
.rk-s small{font-size:11px;color:var(--muted)}
.rk-c{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.rk-c input{width:18px;height:18px;accent-color:var(--accent)}
table.cmp{min-width:480px}
table.cmp td,table.cmp th{white-space:normal}
table.cmp td.best{background:var(--accent-soft)}
table.cmp tr.tot td{font-size:15px;border-top:2px solid var(--line)}
.axrate{display:flex;flex-direction:column;gap:2px}
.axrate>div{display:flex;justify-content:space-between;align-items:center;gap:12px}
.axrate span{font-size:13px}
.axrate .star-pick button{font-size:20px}
.axrow{display:flex;gap:8px;align-items:center}
.axrow input,.axrow select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:40px}
.axrow input{flex:1;min-width:0}
html.mob .rk{grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"n b s" "n c c"}
html.mob .rk-n{grid-area:n}html.mob .rk-b{grid-area:b}html.mob .rk-s{grid-area:s;width:72px}html.mob .rk-c{grid-area:c}
html.mob .axfilter .label{display:none}

/* オンライン面接のリンク */
.meet{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.meet a.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--accent-ink)}
.meet.big{margin-top:0}
.meet.big a.btn{min-height:48px;padding:0 20px;font-size:15px;flex:1;justify-content:center}
.meet.big .btn{min-height:48px}

/* 面接前カード（ホームの欄） */
.prepcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:18px 20px;margin-bottom:20px}
.pc-date{width:92px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;padding:10px 0;line-height:1.3}
.pc-date b{font-size:26px}
.pc-date span{font-size:12px}
.pc-date .pc-when{font-weight:700;font-size:13px}
.pc-body{min-width:0;display:flex;flex-direction:column;gap:2px}
.pc-co{font-size:20px;font-weight:700;line-height:1.35}
.pc-ti{color:var(--muted);font-size:14px}
.pc-meta{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:13px}
.pc-meta span{display:flex;gap:8px;align-items:flex-start;min-width:0}
.pc-meta svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--accent)}
.pc-meta em{font-style:normal;color:var(--muted)}
.pc-focus b{color:var(--accent)}
.pc-btn{min-height:48px;padding:0 20px}
html.mob .prepcard{grid-template-columns:auto minmax(0,1fr);gap:14px;padding:16px;align-items:start}
html.mob .pc-date{width:76px}
html.mob .pc-date b{font-size:22px}
html.mob .pc-co{font-size:18px}
html.mob .pc-btn{grid-column:1/-1;width:100%}

/* 面接前カード */
.drawer.wide{width:min(620px,100%)}
.prepbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 16px;margin-bottom:20px}
.prepbar p{margin:0;flex:1;min-width:200px}
.prepbar p b{color:var(--accent)}
.prep-h{display:flex;gap:16px;align-items:center}
.prep-d{flex:none;width:84px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;padding:10px 0;line-height:1.3}
.prep-d b{font-size:24px}
.prep-d span{font-size:11px}
.prep-h h2{margin:2px 0;font-size:20px}
.prep-h p{margin:0;color:var(--muted)}
.prep-info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prep-info>div{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.prep-info b{font-size:13px;font-weight:500;word-break:break-all}
.muted{color:var(--muted)}
.prep-s{border-top:1px solid var(--line);padding-top:12px}
.prep-s h4{margin:0 0 8px;font-size:13px;color:var(--accent);letter-spacing:.04em}
.prep-l{padding:6px 0}
.prep-l b{font-size:15px}
.prep-ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.prep-chips{display:flex;flex-wrap:wrap;gap:6px}
.prep-memo{margin:0;white-space:pre-line;line-height:1.7}
.prep-ms{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.prep-ms b{font-size:22px;color:var(--accent)}
.prep-ms span{font-size:12px;color:var(--muted)}
html.mob .prep-info{grid-template-columns:1fr}

/* 設定のアコーディオン */
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.acc summary::-webkit-details-marker{display:none}
.acc summary b{font-size:15px;display:block}
.acc summary small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.acc .chev{width:22px;height:22px;flex:none;color:var(--muted);transition:transform .2s}
.acc[open] .chev{transform:rotate(180deg)}
.acc-b{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

/* ホーム画面に追加のやり方 */
.istep{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;max-width:820px}
.istep li{display:grid;grid-template-columns:1fr 260px;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.istep-t{display:flex;gap:14px;align-items:flex-start}
.istep-t .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600}
.istep-t b{font-size:16px;display:block;margin-top:4px}
.istep-t p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.7}
html.mob .istep li{grid-template-columns:1fr;gap:12px}

/* 設定 */
.rules{display:flex;flex-direction:column;gap:8px}
.rule{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule select,.rule input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:40px}
.rule .r-type{min-width:140px}
.steps{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--bg);font-size:13px;line-height:1.7}
.steps ol{margin:6px 0;padding-left:20px}
.steps span{color:var(--muted);font-size:12px}

/* 課題のメーターと評価 */
.lm{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.lm .bar{flex:1;max-width:260px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.lm .bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s ease}
.lm .mono{font-size:12px;color:var(--muted);min-width:36px}
.evitem{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.evitem b{font-size:14px}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:4px}
.rate button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 2px;font-size:12px;cursor:pointer;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.3}
.rate button small{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.rate button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rate button[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.hist{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.evlist{display:flex;flex-direction:column;gap:4px;margin:0 0 8px;font-size:13px}
.evlist div{display:flex;justify-content:space-between;gap:8px;align-items:center}
.slv .t{font-weight:700;font-size:13px}

/* 選考の進捗メーター */
.prog{--p0:color-mix(in srgb,var(--accent) 12%,var(--surface));--p1:color-mix(in srgb,var(--accent) 30%,var(--surface));--p2:color-mix(in srgb,var(--accent) 58%,var(--surface));--p3:var(--accent);--p4:var(--gold);
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:20px}
.prog h2{font-size:16px;margin-bottom:6px}
.prog .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.prog .meta b{color:var(--accent);font-weight:500}
.pbar{display:flex;gap:3px;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.pbar button{border:0;padding:0;min-width:10px;cursor:pointer;transition:flex-grow .5s ease}
.pbar button:hover{filter:brightness(1.08)}
.pleg{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.pleg button{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.pleg button:last-child{align-items:flex-end}
.pleg .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pleg .k i{width:7px;height:7px;border-radius:50%;flex:none}
.pleg .v{font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.pleg .v small{font-size:13px;font-weight:500;margin-left:1px}
.today{font-size:13px;color:var(--muted);margin:0 0 12px}
.wx{display:flex;gap:18px;align-items:center;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wx svg{width:84px;height:84px;flex:none}
.wx .wt{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.wx .wn{font-size:22px;font-weight:700;line-height:1.3}
.wx .wm{font-size:13px;color:var(--muted)}
.wx .btn{flex:none}

/* Dashboard */
.pipeline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:20px}
.pipe-row{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.pipe{display:flex;flex-direction:column;gap:6px;cursor:pointer;border:0;background:none;text-align:left;padding:0}
.pipe .n{font-family:var(--font-mono);font-size:26px;font-weight:500;line-height:1}
.pipe .meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pipe .meter i{display:block;height:100%;background:var(--accent)}
.pipe.offer .meter i{background:var(--ok)}
.pipe .nm{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0;padding-top:0}
.date{width:48px;flex:none;text-align:center;border-radius:8px;background:var(--bg);padding:6px 0;line-height:1.2}
.date .d{font-family:var(--font-mono);font-size:18px;font-weight:500}
.date .w{font-size:11px;color:var(--muted)}
.row .body{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.gray{background:var(--bg);color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}

/* Growth */
.timeline{display:flex;flex-direction:column}
.rv{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.rv:first-child{border-top:0;padding-top:0}
.rv .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rv .head b{font-size:15px}
.feel{display:inline-flex;gap:3px;align-items:center}
.feel i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.feel i.on{background:var(--accent)}
.rv .asked{font-size:12px;color:var(--muted);margin:0 0 8px}
.rv ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.rv li{display:flex;gap:8px;align-items:baseline}
.rv li::before{content:"→";color:var(--accent);font-weight:700}
.rv li.done{color:var(--muted)}
.rv li.done::before{content:"✓";color:var(--ok)}
.mastered{display:flex;flex-wrap:wrap;gap:8px}
.mastered .m{display:flex;gap:8px;align-items:center;border:1px solid var(--ok);background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:5px 6px 5px 12px;font-weight:500}
.mastered .m button{border:0;background:none;color:inherit;cursor:pointer;font-size:11px;opacity:.7}
.ladder{display:flex;flex-direction:column;gap:6px}
.ladder div{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.ladder div .mono{width:44px}
.ladder div.cur{color:var(--gold);font-weight:700}
.ladder div.got{color:var(--fg)}

/* Tasks */
.qadd{display:flex;gap:8px;flex-wrap:wrap}
.qadd input,.qadd select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;min-width:0}
.qadd #t-new{flex:1 1 240px}
.qadd #t-cid{flex:0 1 180px}
.qadd #t-due{flex:0 1 150px}
.tpl{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.tpl button{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.tpl button:hover{border-color:var(--accent);color:var(--accent)}
.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:0}
.chk{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:transparent;font-size:13px;font-weight:700;padding:0}
.chk:hover{border-color:var(--ok)}
.task.done .chk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.task .body{flex:1;min-width:0;cursor:pointer}
.task .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .m{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tgroup h3{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:700;display:flex;gap:8px;align-items:center}
.tgroup h3.over{color:var(--bad)}
.tgroup+.tgroup{margin-top:20px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

/* Reminders, bell, banner */
.rmd{display:inline-flex;align-items:center;gap:3px;color:var(--accent)}
.rmd svg{width:12px;height:12px}
.sw{display:flex;gap:8px;align-items:center;cursor:pointer}
.sw input{width:16px;height:16px;accent-color:var(--accent)}
.rem{display:flex;gap:8px;align-items:center}
.rem input{flex:1;min-width:0}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:4px}
.mright{display:flex;align-items:center;gap:8px}
.bell{position:relative;flex:none;border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--fg);padding:0}
.bell svg{width:18px;height:18px}
.bell:hover{border-color:var(--accent);color:var(--accent)}
.bell .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:10px;font-family:var(--font-mono);font-weight:600;display:grid;place-items:center;padding:0 4px}
.nt{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
.nt:first-child{border-top:0;padding-top:0}
.nt .ur{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:transparent}
.nt.unread .ur{background:var(--accent)}
.nt .b{flex:1;min-width:0}
.nt .b b{display:block;font-size:13px}
.nt .b span{display:block;font-size:13px}
.nt .b small{color:var(--muted);font-size:11px}
.nt:not(.unread) .b{color:var(--muted)}
.banner{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(380px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(10,14,22,.22);padding:12px 14px;display:flex;gap:12px;z-index:70;cursor:pointer;text-align:left;color:var(--fg)}
.banner .ic{flex:none;width:38px;height:38px;display:grid;place-items:center}
.banner .ic svg{width:38px;height:38px}
.banner .bd{flex:1;min-width:0}
.banner .app{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.banner .bd b{display:block;font-size:13px}
.banner .bd span{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.banner{animation:drop .3s ease-out}@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}}

/* Calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cal-h .ttl{font-weight:700;font-size:17px;margin-right:auto;font-variant-numeric:tabular-nums}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-w{font-size:11px;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line);font-weight:500}
.cal-w.sun,.cal-d.sun .n{color:var(--bad)}
.cal-w.sat,.cal-d.sat .n{color:var(--accent)}
.cal-d{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal-d:nth-child(7n){border-right:0}
.cal-d:hover{background:var(--bg)}
.cal-d.other{background:var(--bg)}
.cal-d.other .n{opacity:.45}
.cal-d .n{font-family:var(--font-mono);font-size:12px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;flex:none}
.cal-d.today .n{background:var(--accent);color:var(--accent-ink)!important}
.cal-d.sel{background:var(--accent-soft)}
.ce{display:block;width:100%;text-align:left;font-size:11px;border:0;border-left:3px solid var(--muted);border-radius:4px;padding:1px 6px;background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.6}
.cal-d.sel .ce,.cal-d.other .ce{background:var(--surface)}
.ce:hover{filter:brightness(.95)}
.ce.iv{border-color:var(--accent)} .ce.dl{border-color:var(--warn)} .ce.se{border-color:var(--ok)} .ce.in{border-color:var(--gold)}
.cal-more{font-size:11px;color:var(--muted);padding-left:6px}
.dots{display:none;gap:3px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.dots i.iv{background:var(--accent)} .dots i.dl{background:var(--warn)} .dots i.se{background:var(--ok)} .dots i.in{background:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 16px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:3px;border-radius:2px;background:var(--muted)}
.legend i.iv{background:var(--accent)} .legend i.dl{background:var(--warn)} .legend i.se{background:var(--ok)} .legend i.in{background:var(--gold)}
html.mob .cal-d{min-height:58px;padding:4px 2px;align-items:center}
html.mob .ce,html.mob .cal-more{display:none}
html.mob .dots{display:flex}

/* Companies */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.board-wrap{overflow-x:auto;scrollbar-width:none}
.board-wrap::-webkit-scrollbar{display:none}
.board-top{overflow-x:auto;overflow-y:hidden;height:14px;margin-bottom:8px}
.board-top div{height:1px}
.board{display:grid;grid-template-columns:repeat(7,minmax(200px,1fr));gap:12px;min-width:1460px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px;font-weight:700;font-size:13px}
.col-h .c{font-family:var(--font-mono);color:var(--muted);font-weight:400}
.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card .name{font-weight:700}
.card .ind{font-size:12px;color:var(--muted)}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.stars{color:var(--warn);letter-spacing:1px;font-size:12px}
.stars .off{color:var(--line)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:500}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--bg)}
tbody tr:last-child td{border-bottom:0}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:31;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.drawer-h h3{margin:0;font-size:16px}
.drawer-b{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.drawer-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.drawer-f .spacer{flex:1}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stage-pick{display:flex;flex-wrap:wrap;gap:6px}
.stage-pick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12px}
.stage-pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.star-pick button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--line);padding:0 2px}
.star-pick button.on{color:var(--warn)}
.feel-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feel-pick button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 2px;cursor:pointer;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.feel-pick button .mono{font-size:16px;font-weight:600}
.feel-pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

function lessonStat(l){
  const hist=[];let sum=0,doneDate=null;
  [...S.reviews].sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{(r.evals||[]).forEach(v=>{if(v.lid!==l.id)return;sum+=RATES[v.score].pt;hist.push({rid:r.id,date:r.date,score:v.score});if(sum>=100&&!doneDate)doneDate=r.date})});
  if(l.mastered&&!doneDate){sum=100;doneDate=l.mastered}
  return{pct:Math.min(100,sum),done:sum>=100,doneDate,hist};
}

const WX=[

function weather(){
  const has=ids=>S.companies.some(c=>ids.includes(c.stage));
  const stage=has(['offer'])?4:has(['int1','int2','final'])?3:has(['es'])?2:has(['entry','out'])?1:0;
  const over=S.tasks.filter(t=>!t.done&&t.due&&diff(t.due)<0).length;
  const ur=S.events.filter(e=>REVIEWABLE.includes(e.type)&&diff(e.date)<=-2&&diff(e.date)>=-14&&!S.reviews.some(r=>r.evid===e.id)).length;
  const todo=over+ur, clouds=todo===0?0:todo<=2?1:2;
  let name=WX[stage].name;
  if(clouds){name=(stage===4?'晴れ':name)+(clouds===1?'（ところにより雲）':'（くもり）')}
  const next=['エントリー','書類選考','面接','内定'][stage];
  const parts=[];if(over)parts.push(`期限切れのタスク${over}件`);if(ur)parts.push(`未ふりかえり${ur}件`);
  const msg=clouds?`${parts.join('と')}があります。片付けると雲が晴れます。`:stage===4?'内定が出て、やり残しもありません。快晴です。':`次は「${next}」に進むと、太陽がもう少し昇ります。`;
  return {stage,clouds,name,msg,todo};
}
function weatherSVG(n,c){
  const s=WX[n];let rays='';
  if(n>=3){const r1=25,r2=n===4?33:30;[-150,-120,-90,-60,-30].forEach(a=>{const t=a*Math.PI/180;rays+=`M${(50+r1*Math.cos(t)).toFixed(1)} ${(s.cy+r1*Math.sin(t)).toFixed(1)} L${(50+r2*Math.cos(t)).toFixed(1)} ${(s.cy+r2*Math.sin(t)).toFixed(1)} `})}
  const X=[22,42,58,70],W=[18,14,10,8],OP=[.55,.7,.85,1];
  const segs=X.map((x,i)=>`<rect x="${x}" y="68" width="${W[i]}" height="8" rx="4" fill="${i===3&&i<n?'#ffd66b':'#ffffff'}" fill-opacity="${i<n?OP[i]:.15}"/>`).join('');
  const cloud=(x,y,k,o)=>`<g transform="translate(${x} ${y}) scale(${k})" fill="#ffffff" fill-opacity="${o}"><circle r="6"/><circle cx="9" cy="-4" r="8.5"/><circle cx="18" r="6"/><rect y="-1" width="18" height="7"/></g>`;
  return `<svg viewBox="0 0 100 100" role="img" aria-label="空模様：${WX[n].name}"><rect width="100" height="100" rx="22.4" fill="${s.ground}"/>${rays?`<path d="${rays}" stroke="${s.sun}" stroke-width="4" stroke-linecap="round" fill="none"/>`:''}<circle cx="50" cy="${s.cy}" r="20" fill="${s.sun}"/><path d="M0 62H100V77.6A22.4 22.4 0 0 1 77.6 100H22.4A22.4 22.4 0 0 1 0 77.6Z" fill="${s.land}"/>${segs}${c>=1?cloud(30,46,1,.93):''}${c>=2?cloud(56,36,.82,.86):''}</svg>`;
}

/* ---- タスク ---- */
let tmode='open';
const taskDue=d=>{if(!d)return'';const n=diff(d);if(n<0)return`<span class="chip bad">${-n}日超過</span>`;if(n===0)return'<span class="chip bad">今日まで</span>';if(n===1)return'<span class="chip warn">明日まで</span>';return`<span class="chip gray">${md(d)}まで</span>`};
function taskRow(t){const c=comp(t.cid),nr=nextReminder(t);return`<div class="task ${t.done?'done':''}"><button class="chk" data-toggle="${t.id}" aria-label="${t.done?'未完了に戻す':'完了にする'}">✓</button><div class="body" data-task="${t.id}"><div class="t">${esc(t.title)}</div><div class="m">${c?esc(c.name):''}${t.done?`<span>${md(t.done)} 完了</span>`:taskDue(t.due)}${nr?`<span class="rmd" title="次の通知">${BELL}<span class="mono">${fmtDT(nr)}</span></span>`:''}</div></div></div>`}
function tasksHTML(){
  const open=S.tasks.filter(t=>!t.done),done=S.tasks.filter(t=>t.done).sort((a,b)=>b.done.localeCompare(a.done));
  const g={over:[],today:[],week:[],later:[],none:[]};
  open.forEach(t=>{if(!t.due)g.none.push(t);else{const n=diff(t.due);(n<0?g.over:n===0?g.today:n<=7?g.week:g.later).push(t)}});
  Object.values(g).forEach(a=>a.sort((x,y)=>(x.due||'').localeCompare(y.due||'')));
  const grp=(k,label,cls='')=>g[k].length?`<div class="tgroup"><h3 class="${cls}">${label}<span class="mono">${g[k].length}</span></h3><div class="list">${g[k].map(taskRow).join('')}</div></div>`:'';
  return `
  <h1>タスク</h1>
  <p class="sub">ES作成や企業研究など、自分でやることを管理します。</p>
  <section class="panel" style="margin-bottom:20px">
    <form class="qadd" id="qadd">
      <input id="t-new" placeholder="やることを入力（例：ESの下書き）" maxlength="60" aria-label="タスク名">
      <select id="t-cid" aria-label="企業"><option value="">企業なし</option>${S.companies.filter(c=>c.stage!=='out').map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      <input type="date" id="t-due" aria-label="期限">
      <button class="btn primary" type="submit">追加</button>
    </form>
    <div class="tpl"><span class="label">よく使う：</span>${TASK_TPL.map(t=>`<button type="button" data-tpl="${esc(t)}">${esc(t)}</button>`).join('')}</div>
  </section>
  <div class="toolbar"><div class="seg"><button data-tmode="open" aria-pressed="${tmode==='open'}">未完了 ${open.length}</button><button data-tmode="done" aria-pressed="${tmode==='done'}">完了 ${done.length}</button></div></div>
  <section class="panel">
  ${tmode==='open'?(open.length?grp('over','期限切れ','over')+grp('today','今日まで')+grp('week','7日以内')+grp('later','それ以降')+grp('none','期限なし'):'<div class="empty">未完了のタスクはありません。おつかれさまです。</div>')
    :(done.length?`<div class="list">${done.map(taskRow).join('')}</div>`:'<div class="empty">完了したタスクはまだありません</div>')}
  </section>`;
}
function openTask(id,presetCid){
  const t=id?S.tasks.find(x=>x.id===id):{id:null,cid:presetCid||'',title:'',due:'',done:null};
  drawer(id?'タスクの編集':'タスクを追加',`
    <div class="field"><label class="label" for="k-title">やること</label><input id="k-title" maxlength="60" value="${esc(t.title)}" placeholder="例：ESの下書きを仕上げる"></div>
    <div class="field"><label class="label" for="k-cid">企業</label><select id="k-cid"><option value="">（企業なし）</option>${S.companies.map(c=>`<option value="${c.id}" ${c.id===t.cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="field"><label class="label" for="k-due">期限</label><input type="date" id="k-due" value="${t.due}"></div>
    <div class="field"><span class="label">通知</span>
      <label class="sw"><input type="checkbox" id="k-auto" ${t.auto!==false?'checked':''}>期限の${autoText()}</label>
      <p class="hint" style="margin-top:-2px">自動通知の時刻は「設定」でまとめて変えられます。</p>
      <div id="k-rems" style="display:flex;flex-direction:column;gap:6px"></div>
      <button class="btn sm" id="k-addrem" type="button" style="align-self:flex-start">＋ 通知日時を追加</button>
      <p class="hint">本番版ではスマホのPWAにバナー通知で届きます。届いた通知はベルからも確認できます。</p>
    </div>
    <div id="k-confirm"></div>`,
    `${id?'<button class="btn danger" id="k-del">削除</button>':''}<span class="spacer"></span><button class="btn" id="k-cancel">キャンセル</button><button class="btn primary" id="k-save">${id?'保存':'追加'}</button>`);
  setTimeout(()=>$('#k-title').focus(),50);
  let rems=[...(t.reminders||[])];
  const drawRems=()=>{
    $('#k-rems').innerHTML=rems.map((r,i)=>`<div class="rem"><input type="datetime-local" step="300" id="k-rem${i}" value="${r}" aria-label="通知日時${i+1}"><button class="btn sm" type="button" data-rmrem="${i}">削除</button></div>`).join('');
    rems.forEach((r,i)=>$('#k-rem'+i).onchange=e=>rems[i]=e.target.value);
    document.querySelectorAll('[data-rmrem]').forEach(b=>b.onclick=()=>{rems.splice(+b.dataset.rmrem,1);drawRems()});
    $('#k-addrem').hidden=rems.length>=3;
  };
  drawRems();
  $('#k-addrem').onclick=()=>{const base=$('#k-due').value||iso(TODAY);rems.push(addDays(base,-1)+'T12:00');drawRems();$('#k-rem'+(rems.length-1)).focus()};
  $('#k-cancel').onclick=closeLayer;
  $('#k-save').onclick=()=>{
    const title=$('#k-title').value.trim();
    if(!title){$('#k-confirm').innerHTML='<div class="confirm">やることを入力してください</div>';$('#k-title').focus();return}
    const data={title,cid:$('#k-cid').value,due:$('#k-due').value,auto:$('#k-auto').checked,reminders:rems.filter(Boolean).sort()};
    if(id)Object.assign(t,data);else S.tasks.push({id:uid(),done:null,...data});
    save();closeLayer();render();toast(id?'保存しました':'タスクを追加しました');
  };
  if($('#k-del'))$('#k-del').onclick=()=>{
    $('#k-confirm').innerHTML='<div class="confirm">このタスクを削除します<button class="btn danger" id="k-del2">削除する</button></div>';
    $('#k-del2').onclick=()=>{S.tasks=S.tasks.filter(x=>x.id!==id);save();closeLayer();render();toast('削除しました')};
  };
}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  if(t.done){t.done=null;save();render();toast('未完了に戻しました')}
  else commit(()=>{t.done=iso(TODAY)});
}

function renderGuest(){
  const g=$('#guest');
  g.innerHTML=guestPage==='about'?aboutHTML():guestPage==='install'?installHTML(true):guestPage==='signup'?signupHTML():loginHTML();
  g.querySelectorAll('[data-itab]').forEach(b=>b.onclick=()=>{installTab=b.dataset.itab;renderGuest()});
  g.querySelectorAll('[data-gpage]').forEach(b=>b.onclick=()=>goGuest(b.dataset.gpage||null));
  const f=$('#loginForm');if(f)f.onsubmit=e=>{e.preventDefault();enterApp(false)};
  const sf=$('#signupForm');if(sf)sf.onsubmit=e=>{e.preventDefault();enterApp(true)};
}
function goGuest(p){guestPage=p;if(!p)view='dash';closeLayer();render();window.scrollTo(0,0);$('#screen').scrollTop=0}
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let onboarding=false;
function enterApp(isNew){
  S=REAL||S;demo=false;S.loggedIn=true;guestPage=null;
  if(isNew){S.installDone=false;S.installDismissed=false}
  save();
  onboarding=isNew&&!isStandalone();
  view=onboarding?'install':'dash';
  render();window.scrollTo(0,0);$('#screen').scrollTop=0;
  toast(isNew?'登録しました。ようこそ就活日和へ':'ログインしました');
}

function syncBoardScroll(){
  const bt=$('#bt'),bw=$('#bw');if(!bt||!bw){window.onresize=null;return}
  const size=()=>{const inner=$('#btIn');if(!inner)return;inner.style.width=bw.scrollWidth+'px';bt.hidden=bw.scrollWidth<=bw.clientWidth+1};
  size();
  bt.onscroll=()=>{if(bw.scrollLeft!==bt.scrollLeft)bw.scrollLeft=bt.scrollLeft};
  bw.onscroll=()=>{if(bt.scrollLeft!==bw.scrollLeft)bt.scrollLeft=bw.scrollLeft};
  window.onresize=size;
}

function calHTML(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const start=new Date(y,m,1);start.setDate(1-start.getDay());
  const last=new Date(y,m+1,0);const end=new Date(last);end.setDate(last.getDate()+(6-last.getDay()));
  const byDay={};S.events.forEach(e=>(byDay[e.date]=byDay[e.date]||[]).push(e));
  Object.values(byDay).forEach(a=>a.sort((p,q)=>(p.time||'99').localeCompare(q.time||'99')));
  let cells='';
  for(const d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const k=iso(d),es=byDay[k]||[],w=d.getDay();
    const cls=['cal-d',d.getMonth()!==m?'other':'',k===iso(TODAY)?'today':'',k===selDay?'sel':'',w===0?'sun':w===6?'sat':''].join(' ');
    cells+=`<div class="${cls}" data-day="${k}" tabindex="0" aria-label="${d.getMonth()+1}月${d.getDate()}日 予定${es.length}件"><span class="n">${d.getDate()}</span>
      ${es.slice(0,3).map(e=>`<button class="ce ${TYPECLS[e.type]||'ot'}" data-ev="${e.id}" title="${esc((comp(e.cid)?.name||'')+' '+e.title)}">${e.time?`<span class="mono">${e.time}</span> `:''}${esc(comp(e.cid)?.name||e.title)}</button>`).join('')}
      ${es.length>3?`<span class="cal-more">ほか${es.length-3}件</span>`:''}
      ${es.length?`<span class="dots">${es.slice(0,4).map(e=>`<i class="${TYPECLS[e.type]||'ot'}"></i>`).join('')}</span>`:''}
    </div>`;
  }
  const sel=(byDay[selDay]||[]);const sd=parse(selDay);
  return `
  <section class="cal">
    <div class="cal-h"><span class="ttl">${y}年 ${m+1}月</span><button class="btn sm" data-cal="-1" aria-label="前の月">‹ 前月</button><button class="btn sm" data-cal="0">今日</button><button class="btn sm" data-cal="1" aria-label="次の月">翌月 ›</button></div>
    <div class="cal-g">${WD.map((w,i)=>`<div class="cal-w ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('')}${cells}</div>
    <div class="legend"><span><i class="iv"></i>面接</span><span><i class="dl"></i>ES締切・Webテスト</span><span><i class="se"></i>説明会</span><span><i class="in"></i>インターン</span><span><i></i>その他</span></div>
  </section>
  <section class="panel" style="margin-top:20px">
    <h2>${sd.getMonth()+1}月${sd.getDate()}日（${WD[sd.getDay()]}）の予定 <button class="btn sm" data-addday="${selDay}">＋ この日に追加</button></h2>
    <div class="list">${sel.length?sel.map(evRow).join(''):'<div class="empty">予定はありません</div>'}</div>
  </section>`;
}

function openReview(rid,evid){
  const r=rid?rev(rid):null;
  const e0=r?ev(r.evid):evid?ev(evid):null;
  let cid=r?r.cid:e0?e0.cid:'', eid=r?r.evid:e0?e0.id:'', feel=r?r.feel:3;
  const existing=r?S.lessons.filter(l=>l.rid===r.id):[];
  const texts=[0,1,2].map(i=>existing[i]?.text||'');
  // 評価する「前回の課題」：新規なら意識中の課題、編集ならこのふりかえりで評価した課題＋それ以前からの意識中の課題
  const sel={};(r?.evals||[]).forEach(v=>sel[v.lid]=v.score);
  const targets=S.lessons.filter(l=>{if(r&&l.rid===r.id)return false;if(sel[l.id]!=null)return true;if(isDone(l))return false;if(!r)return true;const lr=rev(l.rid);return lr&&lr.date<=r.date});
  const evalHTML=targets.length?`<div class="field"><span class="label">前回の課題、どのくらいできた？</span><p class="hint">選んだ分だけ課題のメーターが上がります（できた +50%、だいたい +30%、少し +15%）。100%で「身についたこと」に移ります。評価しない課題は空けたままで大丈夫です。</p>
      <div style="display:flex;flex-direction:column;gap:10px">${targets.map(l=>{const st=lessonStat(l);return`<div class="evitem"><b>${esc(l.text)}</b>${meter(st.pct)}<div class="rate" data-lid="${l.id}">${RATES.map((x,i)=>`<button type="button" data-score="${i}" aria-pressed="${sel[l.id]===i}">${x.label}<small>+${x.pt}%</small></button>`).join('')}</div></div>`}).join('')}</div></div>`:'';
  const evOpts=()=>`<option value="">（予定を選ばない）</option>`+S.events.filter(e=>(!cid||e.cid===cid)&&diff(e.date)<=0).sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<option value="${e.id}" ${e.id===eid?'selected':''}>${md(e.date)} ${esc(e.title)}</option>`).join('');
  drawer(r?'ふりかえりを編集':'ふりかえり',`
    <p class="hint">短くて大丈夫です。前回の課題を評価して、「次はこうする」を1〜3個書くと、ホームの一番上に表示されます。</p>
    <div class="field"><label class="label" for="r-cid">企業</label><select id="r-cid"><option value="">（企業なし）</option>${S.companies.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="field"><label class="label" for="r-ev">どの予定のふりかえり？</label><select id="r-ev">${evOpts()}</select></div>
    <div class="field"><span class="label">手応え</span><div class="feel-pick" id="r-feel">${FEELS.map((f,i)=>`<button type="button" data-f="${i+1}" aria-pressed="${i+1===feel}"><span class="mono">${i+1}</span>${f}</button>`).join('')}</div></div>
    ${evalHTML}
    <div class="field"><label class="label" for="r-asked">聞かれたこと（任意）</label><textarea id="r-asked" placeholder="例：挫折経験／チームでの役割">${esc(r?.asked||'')}</textarea></div>
    <div class="field"><span class="label">次の課題（次に活かしたいこと・1つ以上・40字まで）</span>
      ${texts.map((t,i)=>`<div class="lesson-in"><input id="r-l${i}" maxlength="40" value="${esc(t)}" placeholder="${['例：結論から先に話す','例：逆質問を3つ用意する','例：質問を最後まで聞いてから答える'][i]}"><span class="cnt" id="r-c${i}">${t.length}/40</span></div>`).join('')}
    </div>
    <div id="r-confirm"></div>`,
    `${r?'<button class="btn danger" id="r-del">削除</button>':''}<span class="spacer"></span><button class="btn" id="r-cancel">キャンセル</button><button class="btn primary" id="r-save">保存</button>`);
  document.querySelectorAll('.rate').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{const lid=g.dataset.lid,s=+b.dataset.score;if(sel[lid]===s)delete sel[lid];else sel[lid]=s;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',sel[lid]===+x.dataset.score))}));
  $('#r-cid').onchange=()=>{cid=$('#r-cid').value;eid='';$('#r-ev').innerHTML=evOpts()};
  $('#r-ev').onchange=()=>{eid=$('#r-ev').value;const e=ev(eid);if(e&&!cid){cid=e.cid;$('#r-cid').value=cid}};
  document.querySelectorAll('#r-feel button').forEach(b=>b.onclick=()=>{feel=+b.dataset.f;document.querySelectorAll('#r-feel button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  [0,1,2].forEach(i=>$('#r-l'+i).oninput=()=>$('#r-c'+i).textContent=$('#r-l'+i).value.length+'/40');
  $('#r-cancel').onclick=closeLayer;
  $('#r-save').onclick=()=>{
    const ls=[0,1,2].map(i=>$('#r-l'+i).value.trim());
    if(!ls.some(Boolean)){$('#r-confirm').innerHTML='<div class="confirm">次に活かしたいことを1つ以上書いてください</div>';$('#r-l0').focus();return}
    const e=ev(eid);
    const data={cid,evid:eid,date:e?e.date:(r?r.date:iso(TODAY)),feel,asked:$('#r-asked').value.trim()};
    data.evals=Object.entries(sel).map(([lid,score])=>({lid,score}));
    const doneBefore=new Set(S.lessons.filter(isDone).map(l=>l.id));
    closeLayer();
    commit(()=>{
      let id=rid;
      if(r)Object.assign(r,data);else{id=uid();S.reviews.push({id,...data})}
      ls.forEach((t,i)=>{
        const old=existing[i];
        if(old){if(t)old.text=t;else S.lessons=S.lessons.filter(l=>l!==old)}
        else if(t)S.lessons.push({id:uid(),rid:id,text:t});
      });
    });
    const newly=S.lessons.filter(l=>isDone(l)&&!doneBefore.has(l.id));
    toast(newly.length?`「${newly[0].text}」が身につきました${newly.length>1?` ほか${newly.length-1}件`:''}`:'ふりかえりを保存しました');
  };
  if($('#r-del'))$('#r-del').onclick=()=>{
    $('#r-confirm').innerHTML='<div class="confirm">このふりかえりと、そこから生まれた「意識すること」を削除します<button class="btn danger" id="r-del2">削除する</button></div>';
    $('#r-del2').onclick=()=>{S.reviews=S.reviews.filter(x=>x.id!==rid);S.lessons=S.lessons.filter(l=>l.rid!==rid);save();closeLayer();render();toast('削除しました')};
  };
}

    ${ls.length?`<div class="field"><span class="label">この企業で学んだこと</span><div class="list">${ls.map(l=>`<div class="row" style="cursor:default"><div class="body"><div class="t" style="white-space:normal">${isDone(l)?'✓ ':'→ '}${esc(l.text)}${isDone(l)?'':` <span class="mono" style="color:var(--muted);font-size:12px">${lessonStat(l).pct}%</span>`}</div></div></div>`).join('')}</div></div>`:''}`:''}

}

function openEvent(id,presetCid,presetDate){
  const e=id?ev(id):{id:null,cid:presetCid||'',type:'面接',date:presetDate||iso(TODAY),time:'',title:''};
  const canReview=id&&diff(e.date)<=0&&REVIEWABLE.includes(e.type);
  const rv=id?S.reviews.find(r=>r.evid===id):null;
  drawer(id?'予定の編集':'予定を追加',`
    ${canReview?`<div class="nudge" style="margin:0"><p>${rv?'ふりかえり済みです。':'この予定はもう終わりました。<b>ふりかえり</b>を書いて次に活かしましょう。'}</p><button class="btn ${rv?'':'gold'}" id="e-rev" type="button">${rv?'ふりかえりを見る':'ふりかえる'}</button></div>`:''}
    ${id&&isPrepTarget(e)?`<div class="prepbar" style="margin:0"><p>面接の前に、企業メモや意識することを1画面で見返せます。</p><button class="btn primary" id="e-prep" type="button">面接前カードを見る</button></div>`:''}
    <div class="field"><label class="label" for="e-cid">企業</label><select id="e-cid"><option value="">（企業なし）</option>${S.companies.map(c=>`<option value="${c.id}" ${c.id===e.cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="field"><label class="label" for="e-type">種類</label><select id="e-type">${EVTYPES.map(t=>`<option ${t===e.type?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label class="label" for="e-title">内容</label><input id="e-title" value="${esc(e.title)}" placeholder="例：一次面接（オンライン）"></div>
    <div class="two"><div class="field"><label class="label" for="e-date">日付</label><input type="date" id="e-date" value="${e.date}"></div><div class="field"><label class="label" for="e-time">時刻</label><input type="time" id="e-time" value="${e.time}"></div></div>
    <div class="field"><label class="label" for="e-place">場所</label><input id="e-place" value="${esc(e.place||'')}" placeholder="例：本社3F受付／オンライン"></div>
    <div class="field"><label class="label" for="e-url">オンライン面接のURL（Zoom・Teams・Google Meet など）</label><input id="e-url" type="url" inputmode="url" value="${esc(e.url||'')}" placeholder="https://zoom.us/j/…"><p class="hint" style="margin:2px 0 0">貼っておくと、面接前カードやホームから「Zoomに参加」ですぐ開けます。</p></div>
    <div class="field"><label class="label" for="e-items">持ち物・メモ</label><input id="e-items" value="${esc(e.items||'')}" placeholder="例：履歴書、筆記用具、学生証"></div>
    <div id="e-confirm"></div>`,
    `${id?'<button class="btn danger" id="e-del">削除</button>':''}<span class="spacer"></span><button class="btn" id="e-cancel">キャンセル</button><button class="btn primary" id="e-save">${id?'保存':'追加'}</button>`);
  if($('#e-rev'))$('#e-rev').onclick=()=>rv?openReview(rv.id):openReview(null,id);
  if($('#e-prep'))$('#e-prep').onclick=()=>openPrep(id);
  $('#e-cancel').onclick=closeLayer;
  $('#e-save').onclick=()=>{
    const date=$('#e-date').value;
    if(!date){$('#e-confirm').innerHTML='<div class="confirm">日付を入力してください</div>';return}
    const url=$('#e-url').value.trim();
    if(url&&!isWebUrl(url)){$('#e-confirm').innerHTML='<div class="confirm">URLは https:// から始まる形で貼ってください</div>';$('#e-url').focus();return}
    const data={cid:$('#e-cid').value,type:$('#e-type').value,title:$('#e-title').value.trim()||$('#e-type').value,date,time:$('#e-time').value,place:$('#e-place').value.trim(),url,items:$('#e-items').value.trim()};
    if(id)Object.assign(e,data);else S.events.push({id:uid(),...data});
    save();closeLayer();render();toast(id?'保存しました':'予定を追加しました');
  };
  if($('#e-del'))$('#e-del').onclick=()=>{
    $('#e-confirm').innerHTML='<div class="confirm">この予定を削除します<button class="btn danger" id="e-del2">削除する</button></div>';
    $('#e-del2').onclick=()=>{S.events=S.events.filter(x=>x.id!==id);S.reviews.forEach(r=>{if(r.evid===id)r.evid=''});save();closeLayer();render();toast('削除しました')};
  };
}

    ['小林 はると','haruto.k@example.com',-7,-9],['加藤 さき','saki.k@example.com',-5,0],['吉田 けんと','kento.y@example.com',-3,-1],
    ['渡辺 ひな','hina.w@example.com',-2,-2],['松本 りく','riku.m@example.com',-1,-1],['井上 ことね','kotone.i@example.com',0,0]

let adminQ='';
function adminHTML(){
  if(!S.admin)S.admin=structuredClone(ADMIN_SAMPLE);
  const A=S.admin,days=A.pv.map((_,i)=>addD(i-A.pv.length+1));
  const todayPv=A.pv.at(-1),todayUv=A.uv.at(-1),weekPv=A.pv.slice(-7).reduce((a,b)=>a+b,0),prevWeekPv=A.pv.slice(-14,-7).reduce((a,b)=>a+b,0);
  const newMonth=A.members.filter(m=>diff(m.reg)>=-30).length;
  const active7=A.members.filter(m=>diff(m.last)>=-6&&!m.stop).length;
  const step=Math.ceil(Math.max(...A.pv)/2/10)*10,mx=step*2,W=960,H=240,pl=40,pb=28,bw=(W-pl-8)/A.pv.length;
  const y=v=>H-pb-(v/mx)*(H-pb-18);
  const ticks=[0,step,mx];
  const chart=`<svg viewBox="0 0 ${W} ${H}" class="ill" role="img" aria-label="直近14日のページビュー。今日は${todayPv}">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" font-size="11" fill="var(--muted)" text-anchor="end">${t}</text>`).join('')}
    ${A.pv.map((v,i)=>`<rect x="${pl+i*bw+bw*0.18}" y="${y(v)}" width="${bw*0.64}" height="${H-pb-y(v)}" rx="3" fill="var(--accent)" fill-opacity="${i===A.pv.length-1?1:.45}"><title>${md(days[i])} ${v}PV・${A.uv[i]}人</title></rect>`).join('')}
    ${days.map((d,i)=>i%2===1||i===days.length-1?`<text x="${pl+i*bw+bw/2}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="middle">${md(d)}</text>`:'').join('')}
    <text x="${pl+(A.pv.length-1)*bw+bw/2}" y="${y(todayPv)-6}" font-size="12" font-weight="700" fill="var(--accent)" text-anchor="middle">${todayPv}</text>
  </svg>`;
  const ms=A.members.filter(m=>!adminQ||(m.name+m.mail).includes(adminQ)).sort((a,b)=>b.reg.localeCompare(a.reg));
  const tile=(l,v,s)=>`<div class="ad-tile"><span class="label">${l}</span><b class="mono">${v}</b><small>${s}</small></div>`;
  const pct=prevWeekPv?Math.round((weekPv-prevWeekPv)/prevWeekPv*100):0;
  return `
  <h1>管理画面 <span class="chip">管理者だけに表示</span></h1>
  <p class="sub">会員の最低限の情報とアクセス数を確認できます。会員の企業・予定・ふりかえりの中身は見られない仕組みです。<span class="chip gray">サンプルデータ</span></p>
  <div class="ad-tiles">
    ${tile('会員数',A.members.length+'人',`今月の新規 ${newMonth}人`)}
    ${tile('直近7日に使った人',active7+'人',`会員の${Math.round(active7/A.members.length*100)}%`)}
    ${tile('今日のアクセス',todayPv+'PV',`${todayUv}人が利用`)}
    ${tile('直近7日のアクセス',weekPv+'PV',`前の7日より ${pct>=0?'+':''}${pct}%`)}
  </div>
  <section class="panel" style="margin-bottom:20px">
    <h2>アクセス数（直近14日）</h2>
    ${chart}
  </section>
  <section class="panel">
    <h2>会員一覧 <span class="label">${A.members.length}人</span></h2>
    <div class="toolbar"><input class="search" id="adQ" placeholder="名前・メールで検索" value="${esc(adminQ)}"></div>
    <div class="tbl-wrap"><table><thead><tr><th>名前</th><th>メールアドレス</th><th>登録日</th><th>最終ログイン</th><th>状態</th><th></th></tr></thead>
    <tbody>${ms.map(m=>`<tr style="cursor:default"><td><b>${esc(m.name)}</b>${m.role==='admin'?' <span class="chip">管理者</span>':''}</td><td class="mono" style="font-size:12px">${esc(m.mail)}</td><td class="mono">${m.reg.replace(/-/g,'/')}</td><td>${diff(m.last)===0?'今日':(-diff(m.last))+'日前'}</td><td>${m.stop?'<span class="chip bad">停止中</span>':'<span class="chip ok">利用中</span>'}</td><td>${m.role==='admin'?'':`<button class="btn sm" data-stop="${m.id}">${m.stop?'再開':'停止'}</button>`}</td></tr>`).join('')}</tbody></table></div>
    <p class="hint" style="margin:10px 0 0">「停止」にすると、その会員はログインできなくなります（データは残ります）。パスワードは管理者にも見えません。</p>
  </section>`;
}
function bindAdmin(){
  if(view!=='admin'||!S.isAdmin)return;
  const qi=$('#adQ');if(qi)qi.oninput=()=>{adminQ=qi.value.trim();const pos=qi.selectionStart;render();const n=$('#adQ');n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>{const m=S.admin.members.find(x=>x.id===b.dataset.stop);m.stop=!m.stop;save();render();toast(m.stop?`${m.name}さんを停止しました`:`${m.name}さんを再開しました`)});
}

/* ---- オンライン面接のURL ---- */
const isWebUrl=u=>/^https?:\/\/[^\s]+$/i.test(u||'');
function meetName(u){
  if(/zoom\.(us|com)/i.test(u))return'Zoom';
  if(/teams\.(microsoft|live)\.com/i.test(u))return'Teams';
  if(/meet\.google\.com/i.test(u))return'Google Meet';
  if(/webex\.com/i.test(u))return'Webex';
  return'オンライン面接';
}
function meetLinkHTML(e,big){
  if(!isWebUrl(e.url))return'';
  return `<div class="meet ${big?'big':''}"><a class="btn primary" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${ICO.video}${meetName(e.url)}に参加</a><button class="btn" type="button" data-copy="${esc(e.url)}">URLをコピー</button></div>`;
}
function bindCopy(root){
  (root||document).querySelectorAll('[data-copy]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const t=b.dataset.copy;
    const fail=()=>toast('コピーできませんでした。予定の編集画面のURL欄からコピーしてください');
    if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>toast('URLをコピーしました')).catch(fail);else fail()});
}

function askedTop(n=6){
  const cnt={};
  S.reviews.forEach(r=>(r.asked||'').split(/[／\/、,\n]/).map(s=>s.trim()).filter(Boolean).forEach(s=>cnt[s]=(cnt[s]||0)+1));
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,n);
}
function openPrep(evid){
  const e=ev(evid);if(!e)return;
  const c=comp(e.cid)||{name:'（企業なし）',memo:'',id:''};
  const d=parse(e.date),n=diff(e.date);
  const when=n===0?'今日':n===1?'明日':n===2?'あさって':`${n}日後`;
  const prev=S.reviews.filter(r=>r.cid===c.id&&r.asked).sort((a,b)=>b.date.localeCompare(a.date));
  const top=askedTop();
  const acts=active();
  const tasks=S.tasks.filter(t=>t.cid===c.id&&!t.done);
  const ms=c.id?matchScore(c):{pct:null};
  const sec=(t,body)=>`<section class="prep-s"><h4>${t}</h4>${body}</section>`;
  drawer('面接前カード',`
    <div class="prep-h">
      <div class="prep-d"><span>${when}</span><b class="mono">${d.getMonth()+1}/${d.getDate()}</b><span>${WD[d.getDay()]}曜 ${e.time||''}</span></div>
      <div style="min-width:0"><div class="label">${esc(e.type)}</div><h2>${esc(c.name)}</h2><p>${esc(e.title)}</p></div>
    </div>
    ${meetLinkHTML(e,true)}
    <div class="prep-info">
      <div><span class="label">場所</span><b>${e.place?esc(e.place):'<span class="muted">未入力</span>'}</b></div>
      <div><span class="label">持ち物・メモ</span><b>${e.items?esc(e.items):'<span class="muted">未入力</span>'}</b></div>
    </div>
    ${sec('この面接で意識すること',acts.length?`<div class="list">${acts.slice(0,4).map(l=>`<div class="prep-l"><b>${esc(l.text)}</b>${meter(lessonStat(l).pct)}</div>`).join('')}</div>`:'<div class="empty">意識中の課題はありません</div>')}
    ${sec('この企業で前回聞かれたこと',prev.length?`<ul class="prep-ul">${prev.map(r=>`<li><span class="mono">${md(r.date)}</span> ${esc(r.asked)}</li>`).join('')}</ul>`:'<div class="empty">まだ記録がありません。初めての面接です</div>')}
    ${sec('ほかの面接でよく聞かれたこと',top.length?`<div class="prep-chips">${top.map(([q,k])=>`<span class="chip gray">${esc(q)}${k>1?` <b class="mono">×${k}</b>`:''}</span>`).join('')}</div>`:'<div class="empty">ふりかえりの「聞かれたこと」がたまると表示されます</div>')}
    ${sec('志望動機・企業メモ',c.memo?`<p class="prep-memo">${esc(c.memo)}</p>`:'<div class="empty">企業の詳細の「メモ」に書いた内容が表示されます</div>')}
    ${sec('この企業のやること',tasks.length?`<div class="list">${tasks.map(taskRow).join('')}</div>`:'<div class="empty">残っているタスクはありません</div>')}
    ${c.id?sec('わたしの軸',`<div class="prep-ms"><b class="mono">${ms.pct==null?'—':ms.pct+'%'}</b><span>マッチ度（${S.axes.filter(a=>a.w).map(a=>`${esc(a.name)} ${axisRating(c,a)?'★'+axisRating(c,a):'未評価'}`).join('・')}）</span></div>`):''}`,
    `<button class="btn" id="p-edit">予定を編集</button><span class="spacer"></span><button class="btn primary" id="p-close">閉じる</button>`,'wide');
  $('#p-close').onclick=closeLayer;
  $('#p-edit').onclick=()=>openEvent(evid);
  bindCopy($('#layer'));
  document.querySelectorAll('#layer [data-toggle]').forEach(b=>b.onclick=()=>{toggleTask(b.dataset.toggle);openPrep(evid)});
  document.querySelectorAll('#layer [data-task]').forEach(b=>b.onclick=()=>openTask(b.dataset.task));
}

document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{
  if(b.dataset.auth==='out'){if(demo){goGuest(null);return}S.loggedIn=false;save();toDemo();closeLayer();render();window.scrollTo(0,0);$('#screen').scrollTop=0;toast('未ログインの画面にしました')}
  else if(demo){closeLayer();enterApp(false)}
});
if(!S.loggedIn)toDemo();
render();
</script>
